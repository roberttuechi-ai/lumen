name: Lumen PR-head smoke validation

on:
  push:
    branches:
      - "review/**"

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Run smoke tests (tests spawn the server in MOCK=1 mode)
        run: npm test
