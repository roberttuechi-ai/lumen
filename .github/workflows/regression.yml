name: lumen regression tests
on:
  push:
    branches: [dev/improvements-2026-11-02]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing automated tests
        run: npm test
